[build-system]
# >=77 for PEP 639: the SPDX `license = "MIT"` string below. The old
# `license = {text = …}` table plus the License classifier are on
# setuptools' removal path and would eventually break the release build.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsmcli"
version = "0.3.0"
description = "HackSmarter CLI — manage labs, systems, and VPN from the terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "mHijuxS"}]
keywords = ["hacksmarter", "cli", "ctf", "security", "labs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
# 3.9 is the floor because CI verifies it (3.9–3.14). 3.8 went EOL in Oct
# 2024 and isn't available on current GitHub runners, so claiming it would
# be an untested promise; 3.9 still ships as the system Python on RHEL 9.
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
    "PyYAML>=5.4.0",
    "rich>=13.0.0",
    "websocket-client>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/mHijuxS/hsmcli"
Repository = "https://github.com/mHijuxS/hsmcli"
Issues = "https://github.com/mHijuxS/hsmcli/issues"

[project.scripts]
hsmcli = "hsmcli:main"

[tool.setuptools]
packages = ["hsmcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
